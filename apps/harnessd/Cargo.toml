[package]
name = "harnessd"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-std"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
rusty-engine = { path = "../../crates/engine" }
rusty-protocol = { path = "../../crates/protocol" }
rusty-runtime = { path = "../../crates/runtime" }
rusty-session-store = { path = "../../crates/session-store", default-features = false }
rusty-transport-ipc = { path = "../../crates/transport-ipc" }
rusty-transport-websocket = { path = "../../crates/transport-websocket" }
rusty-transport-stdio = { path = "../../crates/transport-stdio" }
rusty-transport-mcp = { path = "../../crates/transport-mcp" }
rusty-provider-anthropic = { path = "../../crates/provider-anthropic" }
rusty-provider-openai = { path = "../../crates/provider-openai" }
rusty-provider-openai-compatible = { path = "../../crates/provider-openai-compatible" }
rusty-provider-gemini = { path = "../../crates/provider-gemini" }
rusty-provider-codex = { path = "../../crates/provider-codex" }
rusty-provider-github-copilot = { path = "../../crates/provider-github-copilot" }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
