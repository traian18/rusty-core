[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossterm = "0.28"
harness-engine = { path = "../../crates/harness-engine" }
harness-integration-anthropic = { path = "../../crates/integrations/anthropic" }
harness-integration-claude-code = { path = "../../crates/integrations/claude-code" }
harness-protocol = { path = "../../crates/harness-protocol" }
harness-session-store = { path = "../../crates/harness-session-store" }
ratatui = "0.29"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
