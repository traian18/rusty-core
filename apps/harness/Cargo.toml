[package]
name = "harness"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
crossterm = "0.28"
rusty-engine = { path = "../../crates/engine" }
rusty-provider-anthropic = { path = "../../crates/provider-anthropic" }
rusty-provider-codex = { path = "../../crates/provider-codex" }
rusty-provider-github-copilot = { path = "../../crates/provider-github-copilot" }
rusty-provider-openai = { path = "../../crates/provider-openai" }
rusty-protocol = { path = "../../crates/protocol" }
rusty-session-store = { path = "../../crates/session-store", default-features = false }
pulldown-cmark = "0.13"
ratatui = "0.29"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
unicode-width = "0.2"
