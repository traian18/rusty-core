[package]
name = "rusty-harness-sdk"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stable, application-agnostic Rust SDK facade over the Rusty agent harness engine."
publish = false

[dependencies]
rusty-engine = { path = "../../crates/engine" }
rusty-protocol = { path = "../../crates/protocol" }
rusty-runtime = { path = "../../crates/runtime" }
rusty-session-store = { path = "../../crates/session-store" }
rusty-workspace = { path = "../../crates/workspace" }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true }
rusty-provider-anthropic = { path = "../../crates/provider-anthropic" }
