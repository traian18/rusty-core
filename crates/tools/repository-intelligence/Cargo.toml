[package]
name = "harness-tool-repository-intelligence"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
harness-workspace = { path = "../../harness-workspace" }
harness-git-analysis = { path = "../../harness-git-analysis" }
harness-findings = { path = "../../harness-findings" }
harness-tools = { path = "../../harness-tools" }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
harness-repository-imports = { path = "../../harness-repository-imports" }
harness-repository-frameworks = { path = "../../harness-repository-frameworks" }
git2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
