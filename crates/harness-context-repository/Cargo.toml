[package]
name = "harness-context-repository"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
harness-context = { path = "../harness-context" }
harness-protocol = { path = "../harness-protocol" }
harness-runtime = { path = "../harness-runtime" }
harness-workspace = { path = "../harness-workspace" }
harness-git-analysis = { path = "../harness-git-analysis" }
harness-findings = { path = "../harness-findings" }
harness-repository-wiki = { path = "../harness-repository-wiki" }
