[package]
name = "rusty-frameworks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
rusty-repo-model = { path = "../repo-model" }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-php = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rusty-lang-api = { path = "../lang-api" }
rusty-lang-python = { path = "../lang-python" }
rusty-lang-go = { path = "../lang-go" }
rusty-lang-java = { path = "../lang-java" }
rusty-lang-csharp = { path = "../lang-csharp" }
rusty-lang-php = { path = "../lang-php" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
