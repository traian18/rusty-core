[package]
name = "harness-engine"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
harness-core = { path = "../harness-core" }
harness-protocol = { path = "../harness-protocol" }
harness-runtime = { path = "../harness-runtime", features = ["testing"] }
harness-context = { path = "../harness-context" }
harness-session-store = { path = "../harness-session-store" }
harness-workspace = { path = "../harness-workspace" }
harness-tools = { path = "../harness-tools" }
harness-tool-filesystem = { path = "../tools/filesystem" }
harness-tool-shell = { path = "../tools/shell" }
harness-tool-git = { path = "../tools/git" }
harness-tool-web = { path = "../tools/web" }
harness-tool-mcp = { path = "../tools/mcp" }
harness-skills = { path = "../harness-skills" }
harness-tool-skills = { path = "../tools/skills" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "fs"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "time"] }
