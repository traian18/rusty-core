[package]
name = "harness-integration-codex"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
harness-protocol = { path = "../../harness-protocol" }
harness-runtime = { path = "../../harness-runtime" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "macros", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

harness-generic-backend = { path = "../../harness-generic-backend" }
harness-model = { path = "../../harness-model" }
harness-integration-openai-responses = { path = "../openai-responses" }
serde = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
base64 = { workspace = true }
chrono = { workspace = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tempfile = "3"
harness-engine = { path = "../../harness-engine" }
harness-tools = { path = "../../harness-tools" }
harness-context = { path = "../../harness-context" }
