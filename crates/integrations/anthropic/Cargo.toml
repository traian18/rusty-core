[package]
name = "harness-integration-anthropic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
harness-generic-backend = { path = "../../harness-generic-backend" }
harness-model = { path = "../../harness-model" }
harness-protocol = { path = "../../harness-protocol" }
harness-runtime = { path = "../../harness-runtime" }
reqwest = { workspace = true, features = ["rustls-tls"] }
rust_decimal.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
harness-engine = { path = "../../harness-engine" }
harness-tools = { path = "../../harness-tools" }
