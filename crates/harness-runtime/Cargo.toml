[package]
name = "harness-runtime"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
testing = []

[dependencies]
harness-core = { path = "../harness-core" }
harness-protocol = { path = "../harness-protocol" }
harness-session-store = { path = "../harness-session-store", default-features = false }
harness-workspace = { path = "../harness-workspace" }
harness-tools = { path = "../harness-tools" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
metrics = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
harness-runtime = { path = ".", features = ["testing"] }
# MemoryStore/FaultInjectingStore, used by this crate's own test modules.
harness-session-store = { path = "../harness-session-store", default-features = false, features = ["testing"] }
tempfile = "3"
git2 = { workspace = true }
rust_decimal_macros = { workspace = true }
