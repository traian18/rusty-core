[package]
name = "rusty-provider-github-copilot"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
rusty-protocol = { path = "../protocol" }
rusty-runtime = { path = "../runtime" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "sync", "macros"] }
tokio-util = { workspace = true }

rusty-model-backend = { path = "../model-backend" }
rusty-provider-openai = { path = "../provider-openai" }
rusty-provider-openai-responses = { path = "../provider-openai-responses" }
rusty-provider-anthropic = { path = "../provider-anthropic" }
reqwest = { workspace = true, features = ["rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
