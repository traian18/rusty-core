[package]
name = "rusty-repo-wiki"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
rusty-repo-model = { path = "../repo-model" }
rusty-git-analysis = { path = "../git-analysis" }
