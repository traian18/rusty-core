[package]
name = "harness-generic-backend"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
metrics = { workspace = true }
harness-model = { path = "../harness-model" }
harness-protocol = { path = "../harness-protocol" }
harness-runtime = { path = "../harness-runtime" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Integration tests in `tests/` are separate crates, so `cfg(test)` does not
# reach this crate's `testing` module for them — the self-dependency turns
# the feature on for test builds only, keeping it off for consumers.
harness-generic-backend = { path = ".", features = ["testing"] }
serde_json.workspace = true

[features]
testing = []
