[package]
name = "rusty-workflow-runtime"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
rusty-agent-core = { path = "../agent-core" }
rusty-workflow-core = { path = "../workflow-core" }
rusty-protocol = { path = "../protocol" }
rusty-runtime = { path = "../runtime" }
rusty-session-store = { path = "../session-store", default-features = false }
rusty-workspace = { path = "../workspace" }
rusty-tool-api = { path = "../tool-api" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "process", "io-util"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
git2 = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
rusty-runtime = { path = "../runtime", features = ["testing"] }
rusty-session-store = { path = "../session-store", default-features = false, features = ["testing"] }
rusty-specs = { path = "../specs" }
tempfile = "3"
rust_decimal_macros = { workspace = true }
