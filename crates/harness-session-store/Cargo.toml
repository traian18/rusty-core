[package]
name = "harness-session-store"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# `sqlite` is on by default so existing embedders keep `SqliteSessionStore`
# without changing anything. It is separable because `rusqlite`'s `bundled`
# feature compiles SQLite itself from C — real build time and a real C
# toolchain requirement — which a host that only ever uses
# `JsonlSessionStore` (as both `harnessd` and `apps/harness` do) should not
# have to pay. Opt out with `default-features = false`.
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:r2d2", "dep:r2d2_sqlite"]
# In-memory and fault-injecting stores for tests. Off by default so they do
# not reach a release binary.
testing = []

[dependencies]
metrics = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs", "io-util"] }
harness-protocol = { path = "../harness-protocol" }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
r2d2 = { workspace = true, optional = true }
r2d2_sqlite = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests under `tests/` are separate crates, so `cfg(test)` does
# not enable the `testing` module for them.
harness-session-store = { path = ".", features = ["testing"] }
