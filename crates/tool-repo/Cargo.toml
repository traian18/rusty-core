[package]
name = "rusty-tool-repo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
rusty-repo-model = { path = "../repo-model" }
rusty-repo-wiki = { path = "../repo-wiki" }
rusty-git-analysis = { path = "../git-analysis" }
rusty-findings = { path = "../findings" }
rusty-tool-api = { path = "../tool-api" }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rusty-lang-api = { path = "../lang-api" }
rusty-frameworks = { path = "../frameworks" }
git2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
