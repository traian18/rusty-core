[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/code-analysis",
    "crates/code-health",
    "crates/context",
    "crates/context-repo",
    "crates/engine",
    "crates/extension-api",
    "crates/findings",
    "crates/frameworks",
    "crates/git-analysis",
    "crates/goals",
    "crates/guidelines",
    "crates/infra-analysis",
    "crates/lang-api",
    "crates/lang-csharp",
    "crates/lang-go",
    "crates/lang-java",
    "crates/lang-native",
    "crates/lang-php",
    "crates/lang-python",
    "crates/model-backend",
    "crates/protocol",
    "crates/provider-anthropic",
    "crates/provider-codex",
    "crates/provider-gemini",
    "crates/provider-github-copilot",
    "crates/provider-openai",
    "crates/provider-openai-compatible",
    "crates/provider-openai-responses",
    "crates/repo-model",
    "crates/repo-wiki",
    "crates/runtime",
    "crates/session-store",
    "crates/skills",
    "crates/specs",
    "crates/tool-api",
    "crates/tool-code",
    "crates/tool-filesystem",
    "crates/tool-git",
    "crates/tool-mcp",
    "crates/tool-repo",
    "crates/tool-shell",
    "crates/tool-web",
    "crates/transport-ipc",
    "crates/transport-mcp",
    "crates/transport-stdio",
    "crates/transport-websocket",
    "crates/workflow-core",
    "crates/workflow-runtime",
    "crates/workspace",
    "apps/harness",
    "apps/harnessd",
    "apps/harnessctl",
    "sdk/rust",
]
exclude = ["xtask"]

# Build-time profile tuning.
#
# Without these, every one of the ~390 resolved dependencies is compiled with
# full debuginfo, which is what drove `target/` to 70 GB and 600k+ files in
# `debug/deps`. Cargo never garbage-collects that directory, so the cost is
# paid on every invocation: resolving artifacts out of it, linking against
# it, and launching ~50 test binaries from it dominated wall time far more
# than compiling or running the tests ever did.
[profile.dev]
# Enough for `file:line` in panics and backtraces — which is all the test
# suite and day-to-day debugging actually consume — without emitting full
# DWARF for every generic instantiation.
debug = "line-tables-only"

[profile.dev.package."*"]
# Applies to dependencies only, never to workspace members. You do not step
# into `libgit2-sys` or `ring`, so their debuginfo is pure weight.
debug = false

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suciuvictortraian/rusty-core"
authors = ["Victor Suciu Traian"]

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
rust_decimal_macros = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
schemars = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
regex = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
git2 = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.24"
html2text = "0.12"
libc = "0.2"
base64 = "0.22"
zeroize = "1"
metrics = "0.24"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-php = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-bash = "0.25"
toml = "1.1.8"
sha2 = "0.10"
tempfile = "3"
