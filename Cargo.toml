[workspace]
resolver = "2"
members = [
    "crates/harness-protocol",
    "crates/harness-core",
    "crates/harness-runtime",
    "crates/harness-engine",
    "crates/harness-model",
    "crates/harness-generic-backend",
    "crates/harness-tools",
    "crates/harness-context",
    "crates/harness-workspace",
    "crates/harness-session-store",
    "crates/harness-extension-api",
    "crates/integrations/anthropic",
    "crates/integrations/openai",
    "crates/integrations/gemini",
    "crates/integrations/openai-compatible",
    "crates/integrations/claude-code",
    "crates/integrations/codex",
    "crates/integrations/github-copilot",
    "crates/tools/filesystem",
    "crates/tools/shell",
    "crates/tools/git",
    "crates/tools/web",
    "crates/transports/websocket",
    "crates/transports/stdio",
    "crates/transports/ipc",
    "apps/harness",
    "apps/harnessd",
    "apps/harnessctl",
    "sdk/rust",
]
exclude = ["xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suciuvictortraian/rusty-core"
authors = ["Victor Suciu Traian"]

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
rust_decimal_macros = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
schemars = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
git2 = "0.18"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.24"
html2text = "0.12"
libc = "0.2"
base64 = "0.22"
zeroize = "1"
metrics = "0.24"
